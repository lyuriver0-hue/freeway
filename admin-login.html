<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 로그인 | FREEWAY 내부 시스템</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/admin.css">
<meta name="robots" content="noindex, nofollow">
</head>
<body class="admin-body">
<div class="admin-login-wrap">
  <div style="text-align:center; margin-bottom:20px;">
    <div style="font-weight:900; font-size:18px; color:var(--gray-900);">FREEWAY 관리자 시스템</div>
    <div class="text-muted" style="font-size:12.5px; margin-top:4px;">내부 운영자 전용 페이지입니다. 일반 회원은 이용하실 수 없습니다.</div>
  </div>
  <div class="admin-login-card">
    <form id="admin-login-form" novalidate>
      <div class="field" id="f-aid">
        <label>관리자 이메일</label>
        <input type="email" name="email" placeholder="admin@freeway.com">
        <div class="error-msg">이메일 또는 비밀번호가 올바르지 않습니다.</div>
      </div>
      <div class="field" id="f-apw">
        <label>비밀번호</label>
        <input type="password" name="password" placeholder="비밀번호">
      </div>
      <button type="submit" class="admin-btn dark" style="width:100%; padding:12px; font-size:14px;">관리자 로그인</button>
    </form>
    <div class="hint" style="text-align:center; margin-top:16px;">데모 계정: admin@freeway.com / admin1234</div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/admin-data.js"></script>
<script>
  document.getElementById('admin-login-form').addEventListener('submit', (e)=>{
    e.preventDefault();
    const email = e.target.email.value.trim();
    const pw = e.target.password.value;
    const acc = ADMIN_ACCOUNTS.find(a=>a.email===email && a.password===pw);
    document.getElementById('f-aid').classList.toggle('error', !acc);
    if(acc){
      AdminStore.setSession({email:acc.email, name:acc.name, roleId:acc.roleId});
      location.href = 'admin-dashboard.html';
    }
  });
</script>
</body>
</html>
