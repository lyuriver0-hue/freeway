<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>독서 캘린더</title>
<style>
  :root{
    --bg:#fbf6ee;
    --surface:#fffdf8;
    --surface-warm:#f1e3cf;
    --fg:#201914;
    --fg-2:#4c4037;
    --muted:#7a6d63;
    --accent:#9b5b32;
    --accent-on:#ffffff;
    --accent-hover:color-mix(in oklab, var(--accent), black 8%);
    --accent-active:color-mix(in oklab, var(--accent), black 14%);
    --success:#4f8a4f;
    --warn:#c9822f;
    --danger:#b33a3a;
    --border:#ded2c3;
    --border-soft:#eee4d7;
    --font-display:Georgia,"Times New Roman",serif;
    --font-body:Inter,system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
    --text-xs:12px;
    --text-sm:14px;
    --text-base:17px;
    --text-lg:20px;
    --text-xl:28px;
    --text-2xl:42px;
    --radius-sm:10px;
    --radius-md:16px;
    --radius-lg:24px;
    --radius-pill:9999px;
    --elev-ring:0 0 0 1px var(--border);
    --elev-raised:0 20px 52px rgba(32,25,20,0.12);
    --focus-ring:0 0 0 4px rgba(155,91,50,0.24);
    --motion-fast:150ms;
    --motion-base:240ms;
    --ease-standard:cubic-bezier(0.2,0,0,1);
    --container-max:1180px;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:var(--font-body);
    font-size:var(--text-base);
    line-height:1.62;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width:var(--container-max);
    margin:0 auto;
    padding:48px 24px 96px;
  }

  header.app-header{
    text-align:center;
    margin-bottom:40px;
  }
  header.app-header h1{
    font-family:var(--font-display);
    font-size:var(--text-2xl);
    letter-spacing:-0.025em;
    margin:0 0 8px;
    color:var(--fg);
  }
  header.app-header p{
    margin:0;
    color:var(--muted);
    font-size:var(--text-sm);
  }

  .card{
    background:var(--surface);
    border-radius:var(--radius-lg);
    box-shadow:var(--elev-ring), var(--elev-raised);
    padding:28px;
  }

  .add-form{
    margin-bottom:40px;
  }
  .add-form h2{
    font-family:var(--font-display);
    font-size:var(--text-lg);
    margin:0 0 20px;
    font-weight:normal;
  }
  .form-grid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr auto;
    gap:14px;
    align-items:end;
  }
  @media (max-width:820px){
    .form-grid{ grid-template-columns:1fr 1fr; }
  }
  .field label{
    display:block;
    font-size:var(--text-xs);
    color:var(--muted);
    margin-bottom:6px;
    letter-spacing:0.02em;
  }
  .field input{
    width:100%;
    padding:11px 13px;
    font-size:var(--text-sm);
    font-family:var(--font-body);
    color:var(--fg);
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    outline:none;
    transition:box-shadow var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
  }
  .field input:focus{
    border-color:var(--accent);
    box-shadow:var(--focus-ring);
  }
  button.btn-primary{
    padding:11px 22px;
    font-size:var(--text-sm);
    font-family:var(--font-body);
    font-weight:600;
    color:var(--accent-on);
    background:var(--accent);
    border:none;
    border-radius:var(--radius-sm);
    cursor:pointer;
    transition:background var(--motion-fast) var(--ease-standard);
    white-space:nowrap;
  }
  button.btn-primary:hover{ background:var(--accent-hover); }
  button.btn-primary:active{ background:var(--accent-active); }
  button.btn-primary:disabled{ opacity:0.55; cursor:not-allowed; }

  .form-msg{
    margin-top:14px;
    font-size:var(--text-sm);
    display:none;
  }
  .form-msg.show{ display:block; }
  .form-msg.error{ color:var(--danger); }
  .form-msg.loading{ color:var(--muted); }
  .form-msg.success{ color:var(--success); }

  .spinner{
    display:inline-block;
    width:13px; height:13px;
    border:2px solid var(--border);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin 0.7s linear infinite;
    vertical-align:middle;
    margin-right:6px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* calendar */
  .calendar-card{ margin-bottom:40px; }
  .cal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
  }
  .cal-header h2{
    font-family:var(--font-display);
    font-size:var(--text-lg);
    margin:0;
    font-weight:normal;
    min-width:140px;
    text-align:center;
  }
  .cal-nav{ display:flex; align-items:center; gap:10px; }
  .cal-nav-btns{ display:flex; gap:6px; }
  button.icon-btn{
    width:36px; height:36px;
    border-radius:var(--radius-pill);
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--fg-2);
    font-size:var(--text-base);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
  }
  button.icon-btn:hover{ background:var(--surface-warm); border-color:var(--accent); }
  button.today-btn{
    padding:8px 16px;
    border-radius:var(--radius-pill);
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--fg-2);
    font-size:var(--text-xs);
    cursor:pointer;
    transition:background var(--motion-fast) var(--ease-standard);
  }
  button.today-btn:hover{ background:var(--surface-warm); }

  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
  }
  .cal-dow{
    text-align:center;
    font-size:var(--text-xs);
    color:var(--muted);
    padding-bottom:10px;
    font-weight:600;
    letter-spacing:0.03em;
  }
  .cal-dow.sun{ color:var(--danger); }
  .cal-dow.sat{ color:var(--accent); }

  .cal-cell{
    min-height:98px;
    border:1px solid var(--border-soft);
    border-radius:var(--radius-sm);
    padding:6px;
    background:var(--surface);
    display:flex;
    flex-direction:column;
    gap:4px;
    cursor:pointer;
    transition:box-shadow var(--motion-fast) var(--ease-standard);
  }
  .cal-cell.outside{ background:transparent; border-color:transparent; }
  .cal-cell.outside .cal-daynum{ color:var(--border); }
  .cal-cell.today{ box-shadow:0 0 0 2px var(--accent); }
  .cal-cell:hover{ box-shadow:var(--elev-raised); }

  .cal-day-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:4px;
  }
  .cal-daynum{
    font-size:var(--text-xs);
    color:var(--fg-2);
    font-weight:600;
  }
  .cal-daynum.sun{ color:var(--danger); }
  .cal-daynum.sat{ color:var(--accent); }
  .cal-memo-dot{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--accent);
    flex-shrink:0;
  }

  .cal-books{
    display:flex;
    flex-wrap:wrap;
    gap:3px;
    align-content:flex-start;
  }
  .cal-book-thumb{
    width:20px; height:28px;
    object-fit:cover;
    border-radius:3px;
    box-shadow:0 1px 3px rgba(32,25,20,0.25);
  }
  .cal-more{
    font-size:10px;
    color:var(--muted);
    align-self:center;
    padding-left:2px;
  }

  /* book list */
  .list-card h2{
    font-family:var(--font-display);
    font-size:var(--text-lg);
    margin:0 0 20px;
    font-weight:normal;
  }
  .book-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px,1fr));
    gap:18px;
  }
  .empty-msg{
    color:var(--muted);
    font-size:var(--text-sm);
    text-align:center;
    padding:24px 0;
  }
  .book-item{
    position:relative;
    background:var(--bg);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-md);
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:box-shadow var(--motion-fast) var(--ease-standard);
  }
  .book-item:hover{ box-shadow:var(--elev-raised); }
  .book-item img.cover{
    width:100%;
    aspect-ratio:3/4.2;
    object-fit:cover;
    border-radius:var(--radius-sm);
    background:var(--surface-warm);
    box-shadow:0 4px 12px rgba(32,25,20,0.15);
  }
  .book-item .b-title{
    font-family:var(--font-display);
    font-size:var(--text-sm);
    line-height:1.35;
    color:var(--fg);
    margin:0;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .book-item .b-author{
    font-size:var(--text-xs);
    color:var(--muted);
    margin:0;
  }
  .book-item .b-dates{
    font-size:11px;
    color:var(--accent);
    margin:0;
    font-weight:600;
  }
  .book-item .b-link{
    font-size:11px;
    color:var(--muted);
    text-decoration:none;
    border-bottom:1px dotted var(--muted);
    align-self:flex-start;
  }
  .book-item .b-link:hover{ color:var(--accent); border-color:var(--accent); }
  .del-btn{
    position:absolute;
    top:8px; right:8px;
    width:24px; height:24px;
    border-radius:50%;
    border:none;
    background:rgba(32,25,20,0.55);
    color:#fff;
    font-size:13px;
    line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background var(--motion-fast) var(--ease-standard);
  }
  .del-btn:hover{ background:var(--danger); }

  /* modal */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(32,25,20,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:100;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background:var(--surface);
    border-radius:var(--radius-lg);
    box-shadow:var(--elev-raised);
    max-width:480px;
    width:100%;
    max-height:80vh;
    overflow-y:auto;
    padding:26px;
  }
  .modal-box h3{
    font-family:var(--font-display);
    font-size:var(--text-lg);
    margin:0 0 18px;
    font-weight:normal;
  }
  .modal-subhead{
    font-size:var(--text-xs);
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin:0 0 10px;
    font-weight:600;
  }
  .modal-book{
    display:flex;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--border-soft);
  }
  .modal-book:last-child{ border-bottom:none; }
  .modal-book img{
    width:64px; height:90px;
    object-fit:cover;
    border-radius:6px;
    box-shadow:0 3px 10px rgba(32,25,20,0.2);
    flex-shrink:0;
    background:var(--surface-warm);
  }
  .modal-book-info{ flex:1; min-width:0; }
  .modal-book-info .b-title{
    font-family:var(--font-display);
    font-size:var(--text-sm);
    margin:0 0 4px;
    color:var(--fg);
  }
  .modal-book-info .b-author{
    font-size:var(--text-xs);
    color:var(--muted);
    margin:0 0 4px;
  }
  .modal-book-info .b-dates{
    font-size:11px;
    color:var(--accent);
    font-weight:600;
    margin:0;
  }
  .modal-close{
    display:block;
    margin:20px auto 0;
    padding:9px 20px;
    border-radius:var(--radius-pill);
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--fg-2);
    font-size:var(--text-sm);
    cursor:pointer;
  }
  .modal-close:hover{ background:var(--surface-warm); }

  .modal-memo{
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid var(--border-soft);
  }
  .modal-memo textarea{
    width:100%;
    padding:11px 13px;
    font-size:var(--text-sm);
    font-family:var(--font-body);
    color:var(--fg);
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    outline:none;
    resize:vertical;
    min-height:70px;
    transition:box-shadow var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
  }
  .modal-memo textarea:focus{
    border-color:var(--accent);
    box-shadow:var(--focus-ring);
  }
  .memo-actions{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
    margin-top:10px;
  }
  .memo-saved-msg{
    font-size:var(--text-xs);
    color:var(--success);
  }
  .btn-save-memo{
    padding:8px 18px;
    border-radius:var(--radius-pill);
    border:none;
    background:var(--accent);
    color:var(--accent-on);
    font-size:var(--text-sm);
    font-weight:600;
    cursor:pointer;
    transition:background var(--motion-fast) var(--ease-standard);
  }
  .btn-save-memo:hover{ background:var(--accent-hover); }
</style>
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <h1>📚 독서 캘린더</h1>
    <p>교보문고 도서 링크로 나만의 독서 기록을 달력에 남겨보세요</p>
  </header>

  <section class="card add-form">
    <h2>새 도서 추가</h2>
    <form id="addForm">
      <div class="form-grid">
        <div class="field">
          <label for="bookUrl">교보문고 도서 링크</label>
          <input type="text" id="bookUrl" placeholder="https://product.kyobobook.co.kr/detail/S000000000000" required>
        </div>
        <div class="field">
          <label for="startDate">읽기 시작일</label>
          <input type="date" id="startDate" required>
        </div>
        <div class="field">
          <label for="endDate">읽기 종료일</label>
          <input type="date" id="endDate" required>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">추가하기</button>
      </div>
    </form>
    <div class="form-msg" id="formMsg"></div>
  </section>

  <section class="card calendar-card">
    <div class="cal-header">
      <div class="cal-nav">
        <div class="cal-nav-btns">
          <button class="icon-btn" id="prevMonth" title="이전 달">‹</button>
          <button class="icon-btn" id="nextMonth" title="다음 달">›</button>
        </div>
      </div>
      <h2 id="calTitle"></h2>
      <button class="today-btn" id="gotoToday">오늘</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </section>

  <section class="card list-card">
    <h2>등록된 도서 (<span id="bookCount">0</span>)</h2>
    <div class="book-grid" id="bookGrid"></div>
  </section>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3 id="modalDate"></h3>
    <div id="modalBooksSection">
      <p class="modal-subhead">읽은 책</p>
      <div id="modalBooks"></div>
    </div>
    <div class="modal-memo">
      <p class="modal-subhead">메모</p>
      <textarea id="memoInput" rows="3" placeholder="이 날의 메모를 남겨보세요"></textarea>
      <div class="memo-actions">
        <span class="memo-saved-msg" id="memoSavedMsg"></span>
        <button type="button" class="btn-save-memo" id="saveMemoBtn">저장</button>
      </div>
    </div>
    <button class="modal-close" id="modalClose">닫기</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "kyobo-reading-calendar-books";
  var MEMO_KEY = "kyobo-reading-calendar-memos";
  var JINA_PREFIX = "https://r.jina.ai/";

  var state = {
    books: loadBooks(),
    memos: loadMemos(),
    viewYear: new Date().getFullYear(),
    viewMonth: new Date().getMonth() // 0-based
  };

  function loadBooks(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      console.error("Failed to load books from storage", e);
      return [];
    }
  }

  function saveBooks(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.books));
  }

  function loadMemos(){
    try{
      var raw = localStorage.getItem(MEMO_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){
      console.error("Failed to load memos from storage", e);
      return {};
    }
  }

  function saveMemos(){
    localStorage.setItem(MEMO_KEY, JSON.stringify(state.memos));
  }

  function toDateOnly(str){
    // str: "YYYY-MM-DD" -> Date at local midnight
    var parts = str.split("-").map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }

  function fmtDateStr(d){
    var y=d.getFullYear(), m=("0"+(d.getMonth()+1)).slice(-2), day=("0"+d.getDate()).slice(-2);
    return y+"-"+m+"-"+day;
  }

  function isSameDay(a,b){
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }

  // ---------- Kyobo page parsing ----------

  function normalizeKyoboUrl(input){
    var url = input.trim();
    if(!/^https?:\/\//i.test(url)){
      throw new Error("올바른 URL 형식이 아닙니다 (http:// 또는 https://로 시작해야 합니다)");
    }
    if(!/kyobobook\.co\.kr/i.test(url)){
      throw new Error("교보문고(kyobobook.co.kr) 링크만 지원합니다");
    }
    return url;
  }

  async function fetchBookInfo(kyoboUrl){
    var proxyUrl = JINA_PREFIX + kyoboUrl;
    var res;
    try{
      res = await fetch(proxyUrl);
    }catch(e){
      throw new Error("페이지를 불러오는 중 네트워크 오류가 발생했습니다");
    }
    if(!res.ok){
      throw new Error("페이지를 불러오지 못했습니다 (HTTP " + res.status + ")");
    }
    var text = await res.text();
    return parseKyoboText(text, kyoboUrl);
  }

  function parseKyoboText(text, originalUrl){
    // 1) Baseline title/author from the reader's meta "Title:" line,
    //    which mirrors the page's <title> tag and is present even when
    //    the rest of the page body renders incompletely.
    var metaTitle = "", metaAuthor = "";
    var titleLineMatch = text.match(/^Title:\s*(.+)$/m);
    if(titleLineMatch){
      var full = titleLineMatch[1].trim().replace(/\s*-\s*교보문고\s*$/, "");
      var idx = full.indexOf(" | ");
      if(idx >= 0){
        metaTitle = full.slice(0, idx).trim();
        metaAuthor = full.slice(idx+3).trim();
      } else {
        metaTitle = full;
      }
    }

    var title = metaTitle;
    var image = "";

    // 2) Prefer the hero "대표 이미지" alt-text pattern which reliably pairs
    //    the true product title with its cover image on the CDN.
    var heroMatch = text.match(/!\[Image\s*\d+:\s*(.+?)\s*대표\s*이미지\]\((https:\/\/contents\.kyobobook\.co\.kr[^\)]+)\)/);
    if(heroMatch){
      title = heroMatch[1].trim();
      image = heroMatch[2].trim();
    }

    // 3) Author: look for linked name(s) immediately followed by a role
    //    label (저자(글)/지은이/엮은이/편저자/원작/그림 etc., covering both
    //    regular books and comics/graphic adaptations) on a single line
    //    near the top of the document. Matching is restricted to one line
    //    at a time so unrelated nav links (e.g. "[sam](...)", "[eBook](...)")
    //    that sit on earlier lines can't be swept into the match.
    var ROLE_LABELS = /(저자\(글\)|지은이|엮은이|편저자|원작|구성|그림\/만화|글그림|그림|지음)/;
    var author = metaAuthor;
    var headEnd = text.indexOf("\n## ");
    var headArea = headEnd > 0 ? text.slice(0, headEnd) : text.slice(0, 4000);
    var authorLine = headArea.split("\n").find(function(line){
      return ROLE_LABELS.test(line) && /\[[^\]]+\]\([^\)]+\)/.test(line);
    });
    if(authorLine){
      var roleMatch = authorLine.match(new RegExp("^(.*?)" + ROLE_LABELS.source));
      var namesSegment = roleMatch ? roleMatch[1] : authorLine;
      var nameMatches = namesSegment.match(/\[([^\]]+)\]/g) || [];
      var names = nameMatches.map(function(m){ return m.slice(1,-1); });
      if(names.length) author = names.join(", ");
    }

    // 4) Fallback cover image: Kyobo's CDN follows a predictable pattern
    //    keyed off ISBN, which is always present in the info table.
    if(!image){
      var isbnMatch = text.match(/ISBN\s*\|\s*(\d{10,13})/);
      if(isbnMatch){
        image = "https://contents.kyobobook.co.kr/sih/fit-in/458x0/pdt/" + isbnMatch[1] + ".jpg";
      }
    }

    if(!title){
      throw new Error("도서 제목을 인식하지 못했습니다. 링크를 확인해주세요");
    }

    return {
      title: title,
      author: author || "저자 미상",
      image: image,
      url: originalUrl
    };
  }

  // ---------- Form handling ----------

  var addForm = document.getElementById("addForm");
  var bookUrlInput = document.getElementById("bookUrl");
  var startDateInput = document.getElementById("startDate");
  var endDateInput = document.getElementById("endDate");
  var submitBtn = document.getElementById("submitBtn");
  var formMsg = document.getElementById("formMsg");

  function setFormMsg(text, type){
    formMsg.textContent = "";
    if(type === "loading"){
      var spin = document.createElement("span");
      spin.className = "spinner";
      formMsg.appendChild(spin);
      formMsg.appendChild(document.createTextNode(text));
    } else {
      formMsg.textContent = text;
    }
    formMsg.className = "form-msg show " + (type || "");
  }

  function clearFormMsg(){
    formMsg.className = "form-msg";
    formMsg.textContent = "";
  }

  addForm.addEventListener("submit", async function(e){
    e.preventDefault();
    clearFormMsg();

    var rawUrl = bookUrlInput.value;
    var startVal = startDateInput.value;
    var endVal = endDateInput.value;

    if(!startVal || !endVal){
      setFormMsg("읽기 시작일과 종료일을 모두 입력해주세요", "error");
      return;
    }
    if(toDateOnly(startVal) > toDateOnly(endVal)){
      setFormMsg("종료일은 시작일보다 빠를 수 없습니다", "error");
      return;
    }

    var normalizedUrl;
    try{
      normalizedUrl = normalizeKyoboUrl(rawUrl);
    }catch(err){
      setFormMsg(err.message, "error");
      return;
    }

    submitBtn.disabled = true;
    setFormMsg("도서 정보를 불러오는 중입니다...", "loading");

    try{
      var info = await fetchBookInfo(normalizedUrl);
      var book = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,8),
        title: info.title,
        author: info.author,
        image: info.image,
        url: info.url,
        startDate: startVal,
        endDate: endVal,
        addedAt: new Date().toISOString()
      };
      state.books.push(book);
      saveBooks();
      renderAll();
      setFormMsg('"' + info.title + '" 을(를) 캘린더에 추가했습니다', "success");
      addForm.reset();
    }catch(err){
      console.error(err);
      setFormMsg(err.message || "도서 정보를 가져오는 데 실패했습니다", "error");
    }finally{
      submitBtn.disabled = false;
    }
  });

  // ---------- Calendar rendering ----------

  var calTitle = document.getElementById("calTitle");
  var calGrid = document.getElementById("calGrid");
  var DOW = ["일","월","화","수","목","금","토"];

  function booksOnDate(d){
    return state.books.filter(function(b){
      var s = toDateOnly(b.startDate);
      var e = toDateOnly(b.endDate);
      return d >= s && d <= e;
    });
  }

  function renderCalendar(){
    calTitle.textContent = state.viewYear + "년 " + (state.viewMonth+1) + "월";
    calGrid.innerHTML = "";

    DOW.forEach(function(d, i){
      var el = document.createElement("div");
      el.className = "cal-dow" + (i===0 ? " sun" : i===6 ? " sat" : "");
      el.textContent = d;
      calGrid.appendChild(el);
    });

    var firstOfMonth = new Date(state.viewYear, state.viewMonth, 1);
    var startWeekday = firstOfMonth.getDay();
    var gridStart = new Date(state.viewYear, state.viewMonth, 1 - startWeekday);
    var today = new Date();

    for(var i=0; i<42; i++){
      var cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i);
      var isOutside = cellDate.getMonth() !== state.viewMonth;
      var dow = cellDate.getDay();
      var cell = document.createElement("div");
      cell.className = "cal-cell" + (isOutside ? " outside" : "");
      if(isSameDay(cellDate, today)) cell.classList.add("today");

      var dayRow = document.createElement("div");
      dayRow.className = "cal-day-row";

      var dayNum = document.createElement("div");
      dayNum.className = "cal-daynum" + (dow===0 ? " sun" : dow===6 ? " sat" : "");
      dayNum.textContent = cellDate.getDate();
      dayRow.appendChild(dayNum);

      var hasMemo = !!(state.memos[fmtDateStr(cellDate)] || "").trim();
      if(hasMemo){
        var memoDot = document.createElement("span");
        memoDot.className = "cal-memo-dot";
        memoDot.title = "메모 있음";
        dayRow.appendChild(memoDot);
      }
      cell.appendChild(dayRow);

      var dayBooks = isOutside ? [] : booksOnDate(cellDate);
      if(dayBooks.length){
        cell.classList.add("has-books");
        var thumbWrap = document.createElement("div");
        thumbWrap.className = "cal-books";
        var maxShow = 3;
        dayBooks.slice(0, maxShow).forEach(function(b){
          var img = document.createElement("img");
          img.className = "cal-book-thumb";
          img.src = b.image || "";
          img.alt = b.title;
          img.loading = "lazy";
          img.onerror = function(){ this.style.visibility = "hidden"; };
          thumbWrap.appendChild(img);
        });
        if(dayBooks.length > maxShow){
          var more = document.createElement("span");
          more.className = "cal-more";
          more.textContent = "+" + (dayBooks.length - maxShow);
          thumbWrap.appendChild(more);
        }
        cell.appendChild(thumbWrap);
      }

      cell.addEventListener("click", function(dateForCell, booksForCell){
        return function(){ openDayModal(dateForCell, booksForCell); };
      }(cellDate, dayBooks));

      calGrid.appendChild(cell);
    }
  }

  document.getElementById("prevMonth").addEventListener("click", function(){
    state.viewMonth--;
    if(state.viewMonth < 0){ state.viewMonth = 11; state.viewYear--; }
    renderCalendar();
  });
  document.getElementById("nextMonth").addEventListener("click", function(){
    state.viewMonth++;
    if(state.viewMonth > 11){ state.viewMonth = 0; state.viewYear++; }
    renderCalendar();
  });
  document.getElementById("gotoToday").addEventListener("click", function(){
    var now = new Date();
    state.viewYear = now.getFullYear();
    state.viewMonth = now.getMonth();
    renderCalendar();
  });

  // ---------- Day modal ----------

  var modalOverlay = document.getElementById("modalOverlay");
  var modalDate = document.getElementById("modalDate");
  var modalBooksSection = document.getElementById("modalBooksSection");
  var modalBooks = document.getElementById("modalBooks");
  var memoInput = document.getElementById("memoInput");
  var saveMemoBtn = document.getElementById("saveMemoBtn");
  var memoSavedMsg = document.getElementById("memoSavedMsg");
  var currentModalDateStr = null;

  function openDayModal(date, books){
    currentModalDateStr = fmtDateStr(date);
    modalDate.textContent = (date.getMonth()+1) + "월 " + date.getDate() + "일";
    modalBooksSection.style.display = books.length ? "" : "none";
    modalBooks.innerHTML = "";
    books.forEach(function(b){
      var row = document.createElement("div");
      row.className = "modal-book";

      var img = document.createElement("img");
      img.src = b.image || "";
      img.alt = b.title;
      img.onerror = function(){ this.style.visibility = "hidden"; };
      row.appendChild(img);

      var info = document.createElement("div");
      info.className = "modal-book-info";

      var t = document.createElement("p");
      t.className = "b-title";
      t.textContent = b.title;
      info.appendChild(t);

      var a = document.createElement("p");
      a.className = "b-author";
      a.textContent = b.author;
      info.appendChild(a);

      var d = document.createElement("p");
      d.className = "b-dates";
      d.textContent = b.startDate + " ~ " + b.endDate;
      info.appendChild(d);

      row.appendChild(info);
      modalBooks.appendChild(row);
    });

    memoInput.value = state.memos[currentModalDateStr] || "";
    memoSavedMsg.textContent = "";
    modalOverlay.classList.add("show");
  }

  saveMemoBtn.addEventListener("click", function(){
    var text = memoInput.value.trim();
    if(text){
      state.memos[currentModalDateStr] = text;
    } else {
      delete state.memos[currentModalDateStr];
    }
    saveMemos();
    renderCalendar();
    memoSavedMsg.textContent = "저장되었습니다";
    setTimeout(function(){ memoSavedMsg.textContent = ""; }, 1500);
  });

  document.getElementById("modalClose").addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", function(e){
    if(e.target === modalOverlay) closeModal();
  });
  function closeModal(){ modalOverlay.classList.remove("show"); }

  // ---------- Book list rendering ----------

  var bookGrid = document.getElementById("bookGrid");
  var bookCount = document.getElementById("bookCount");

  function renderBookList(){
    bookCount.textContent = state.books.length;
    bookGrid.innerHTML = "";

    if(!state.books.length){
      var empty = document.createElement("div");
      empty.className = "empty-msg";
      empty.textContent = "아직 등록된 도서가 없습니다. 위에서 교보문고 링크를 추가해보세요.";
      bookGrid.appendChild(empty);
      return;
    }

    var sorted = state.books.slice().sort(function(a,b){
      return a.startDate < b.startDate ? 1 : -1;
    });

    sorted.forEach(function(b){
      var item = document.createElement("div");
      item.className = "book-item";

      var del = document.createElement("button");
      del.className = "del-btn";
      del.textContent = "×";
      del.title = "삭제";
      del.addEventListener("click", function(){
        if(confirm('"' + b.title + '" 을(를) 삭제하시겠습니까?')){
          state.books = state.books.filter(function(x){ return x.id !== b.id; });
          saveBooks();
          renderAll();
        }
      });
      item.appendChild(del);

      var img = document.createElement("img");
      img.className = "cover";
      img.src = b.image || "";
      img.alt = b.title;
      img.loading = "lazy";
      img.onerror = function(){ this.style.background = "var(--surface-warm)"; };
      item.appendChild(img);

      var t = document.createElement("p");
      t.className = "b-title";
      t.textContent = b.title;
      item.appendChild(t);

      var a = document.createElement("p");
      a.className = "b-author";
      a.textContent = b.author;
      item.appendChild(a);

      var d = document.createElement("p");
      d.className = "b-dates";
      d.textContent = b.startDate + " ~ " + b.endDate;
      item.appendChild(d);

      var link = document.createElement("a");
      link.className = "b-link";
      link.href = b.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "교보문고에서 보기 ↗";
      item.appendChild(link);

      bookGrid.appendChild(item);
    });
  }

  function renderAll(){
    renderCalendar();
    renderBookList();
  }

  renderAll();
})();
</script>
</body>
</html>
