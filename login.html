<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | 프리웨이</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .auth-wrap{max-width:420px; margin:40px auto; padding:0 20px;}
  .auth-card{background:#fff; border:1px solid var(--gray-200); border-radius:var(--radius); padding:36px 32px; box-shadow:var(--shadow);}
  .auth-title{text-align:center; margin-bottom:6px; font-size:22px;}
  .auth-sub{text-align:center; color:var(--gray-500); font-size:13.5px; margin-bottom:26px;}
  .social-btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:12px; border:1.5px solid var(--gray-300); border-radius:10px; background:#fff; font-weight:700; font-size:13.5px; margin-bottom:10px; cursor:pointer;}
  .social-btn:hover{background:var(--gray-50);}
  .divider{display:flex; align-items:center; gap:10px; color:var(--gray-500); font-size:12px; margin:20px 0;}
  .divider::before, .divider::after{content:''; flex:1; height:1px; background:var(--gray-200);}
  .auth-foot{text-align:center; font-size:13px; color:var(--gray-500); margin-top:20px;}
  .auth-foot a{color:var(--primary); font-weight:700;}
</style>
</head>
<body>
<header class="site-header"></header>

<main class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title">로그인</h1>
    <p class="auth-sub">프리웨이에서 필요한 전문가를 만나보세요</p>

    <form id="login-form" novalidate>
      <div class="field" id="f-email">
        <label>이메일</label>
        <input type="email" name="email" placeholder="example@email.com">
        <div class="error-msg">올바른 이메일 주소를 입력해주세요.</div>
      </div>
      <div class="field" id="f-password">
        <label>비밀번호</label>
        <input type="password" name="password" placeholder="비밀번호를 입력하세요">
        <div class="error-msg">비밀번호는 6자 이상이어야 합니다.</div>
      </div>
      <div style="display:flex; justify-content:space-between; margin-bottom:18px; font-size:12.5px;">
        <label class="checkbox-row"><input type="checkbox"> 로그인 상태 유지</label>
        <a href="#" style="color:var(--gray-500);">아이디/비밀번호 찾기</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">로그인</button>
    </form>

    <div class="divider">또는</div>
    <button class="social-btn" onclick="doSocialLogin('구글')">🔵 구글로 계속하기</button>
    <button class="social-btn" onclick="doSocialLogin('카카오')">💛 카카오로 계속하기</button>
    <button class="social-btn" onclick="doSocialLogin('네이버')">🟢 네이버로 계속하기</button>

    <div class="auth-foot">아직 계정이 없으신가요? <a href="signup.html">회원가입</a></div>
  </div>
</main>

<footer class="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  freewayMount();

  function setFieldError(id, hasError){
    document.getElementById(id).classList.toggle('error', hasError);
  }

  function doLoginSuccess(name, role){
    FreewayStore.setUser({name, role, email: 'demo@freeway.com'});
    FreewayStore.toast(`${name}님, 환영합니다!`);
    setTimeout(()=>{ location.href = role==='freelancer' ? 'mypage-fl-services.html' : 'index.html'; }, 600);
  }

  function doSocialLogin(provider){
    doLoginSuccess(provider+' 사용자', 'client');
  }

  document.getElementById('login-form').addEventListener('submit', (e)=>{
    e.preventDefault();
    const email = e.target.email.value.trim();
    const pw = e.target.password.value;
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    const pwOk = pw.length >= 6;
    setFieldError('f-email', !emailOk);
    setFieldError('f-password', !pwOk);
    if(emailOk && pwOk){
      doLoginSuccess(email.split('@')[0], 'client');
    }
  });
</script>
</body>
</html>
