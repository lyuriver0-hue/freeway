<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서비스 상세 | 프리웨이</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .detail-layout{display:grid; grid-template-columns:1fr 340px; gap:32px; align-items:start;}
  .gallery{aspect-ratio:16/9; background:linear-gradient(135deg,var(--primary-light),#E0F2FE); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; font-size:80px; margin-bottom:20px;}
  .price-option{border:1.5px solid var(--gray-200); border-radius:12px; padding:16px; margin-bottom:10px; cursor:pointer;}
  .price-option.selected{border-color:var(--primary); background:var(--primary-light);}
  .price-option .name{font-weight:800; font-size:14.5px; margin-bottom:4px;}
  .price-option .desc{font-size:12.5px; color:var(--gray-500); margin-bottom:8px;}
  .price-option .amt{font-weight:800; font-size:17px;}
  .sidebar-card{position:sticky; top:calc(var(--header-h) + 20px);}
  .mini-pro{display:flex; gap:12px; align-items:center; padding:14px 0; border-top:1px solid var(--gray-100); margin-top:14px;}
  .review-item{padding:16px 0; border-bottom:1px solid var(--gray-100);}
  .mobile-bar{display:none;}
  .mini-pro .avatar img{width:100%; height:100%; object-fit:cover; border-radius:inherit;}
  .pf-lightbox{position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:3000; padding:24px;}
  .pf-lightbox.open{display:flex;}
  .pf-lightbox .lb-content{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .pf-lightbox img#lb-img{max-width:min(900px,90vw); max-height:75vh; border-radius:8px;}
  .pf-lightbox .lb-close{position:absolute; top:24px; right:32px; font-size:28px; cursor:pointer; color:#fff;}
  .pf-count-badge{position:absolute; bottom:8px; right:8px; background:rgba(17,24,39,0.7); color:#fff; font-size:11px; font-weight:700; padding:3px 9px; border-radius:100px;}
  .lb-thumbs{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:min(900px,90vw);}
  .lb-thumbs img{width:56px; height:56px; object-fit:cover; border-radius:6px; cursor:pointer; border:2px solid transparent; opacity:.6;}
  .lb-thumbs img.active{border-color:#fff; opacity:1;}
  @media (max-width:900px){
    .detail-layout{grid-template-columns:1fr;}
    .sidebar-card{position:static;}
    body{padding-bottom:76px;}
    .mobile-bar{display:flex; position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--gray-200); padding:12px 16px; justify-content:space-between; align-items:center; z-index:900; gap:12px;}
  }
</style>
</head>
<body>
<header class="site-header"></header>

<main class="page container">
  <div class="breadcrumb"><a href="index.html">홈</a> / <a href="category.html" id="crumb-cat">카테고리</a> / <span>서비스 상세</span></div>

  <div class="detail-layout">
    <div>
      <div class="gallery" id="gallery">🎨</div>
      <span class="badge badge-blue" id="svc-cat-badge">카테고리</span>
      <h1 style="font-size:26px; margin:10px 0 8px;" id="svc-title">서비스 제목</h1>
      <div style="display:flex; gap:14px; align-items:center; color:var(--gray-500); font-size:13.5px; margin-bottom:20px;">
        <span class="stars" id="svc-stars">★★★★★</span>
        <span id="svc-rating-text">4.9 (312건 리뷰)</span>
      </div>

      <div class="tabs" data-tabs>
        <button class="tab-btn active" data-tab-target="tab-desc">상세설명</button>
        <button class="tab-btn" data-tab-target="tab-portfolio">포트폴리오</button>
        <button class="tab-btn" data-tab-target="tab-reviews">리뷰</button>
      </div>
      <div class="tab-panel active" id="tab-desc">
        <p style="line-height:1.9; font-size:14.5px; color:var(--gray-700);" id="svc-desc"></p>
        <div class="trust-strip" style="margin-top:20px;">
          <span class="item">🔒 안전결제(에스크로) 적용</span>
          <span class="item">📄 표준계약서 자동 생성</span>
        </div>
      </div>
      <div class="tab-panel" id="tab-portfolio">
        <div class="grid-3" id="portfolio-grid"></div>
      </div>
      <div class="tab-panel" id="tab-reviews">
        <div id="review-list"></div>
      </div>
    </div>

    <div class="sidebar-card">
      <div class="card pad-20">
        <div id="price-options"></div>
        <button class="btn btn-primary btn-block" style="margin-top:6px;" onclick="FreewayStore.toast('문의가 전송되었습니다')">문의하기</button>
        <div style="display:flex; gap:8px; margin-top:10px;">
          <a class="btn btn-ghost btn-block" href="chat.html">💬 1:1 채팅 문의</a>
          <button class="btn-icon" id="detail-heart">♥</button>
        </div>
        <div style="font-size:12px; color:var(--gray-500); text-align:center; margin-top:10px;">현재까지 문의 <b id="inquiry-count">128</b>건</div>

        <div class="mini-pro" id="mini-pro"></div>
      </div>
    </div>
  </div>
</main>

<div class="mobile-bar">
  <div><span class="svc-price" id="mobile-price">₩0</span></div>
  <button class="btn btn-primary" onclick="FreewayStore.toast('문의가 전송되었습니다')">문의하기</button>
</div>

<div class="pf-lightbox" id="pf-lightbox">
  <span class="lb-close" onclick="closeModal('pf-lightbox')">✕</span>
  <div class="lb-content">
    <img id="lb-img">
    <div class="lb-thumbs" id="lb-thumbs"></div>
  </div>
</div>

<footer class="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  freewayMount('category');
  const params = new URLSearchParams(location.search);
  const svc = FREEWAY_SERVICES.find(s=>s.id===params.get('id')) || FREEWAY_SERVICES[0];
  const fl = FREEWAY_FREELANCERS.find(f=>f.id===svc.freelancerId);

  document.getElementById('gallery').textContent = svc.thumb;
  document.getElementById('svc-cat-badge').textContent = svc.catName;
  document.getElementById('svc-title').textContent = svc.title;
  document.getElementById('svc-rating-text').textContent = `${svc.rating} (${svc.reviews}건 리뷰)`;
  document.getElementById('svc-desc').textContent = `${fl.name} 전문가가 제공하는 ${svc.title} 서비스입니다. 클라이언트의 요구사항에 맞춰 초안 제작부터 최종 납품까지 전 과정을 안전결제와 표준계약서를 기반으로 투명하게 진행합니다. 상세 견적과 일정은 문의 시 맞춤 안내해드립니다.`;
  document.getElementById('crumb-cat').textContent = svc.catName;
  document.getElementById('crumb-cat').href = `category.html?cat=${svc.category}`;
  document.getElementById('detail-heart').setAttribute('data-fav-id', svc.id);
  document.getElementById('mobile-price').textContent = `₩${svc.price.toLocaleString()}~`;

  const flPortfolio = FreewayStore.getFlPortfolio(fl.id);
  document.getElementById('portfolio-grid').innerHTML = flPortfolio.length ? flPortfolio.map(p=>`
    <div class="svc-card" data-pf-view="${p.id}">
      <div class="svc-thumb" style="padding:0;">
        <img src="${p.images[0]}" style="width:100%; height:100%; object-fit:cover;">
        ${p.images.length>1?`<span class="pf-count-badge">🖼 ${p.images.length}</span>`:''}
      </div>
      <div class="svc-body"><div class="svc-title">${p.title}</div></div>
    </div>`).join('') : ['🖼️','🖌️','📐'].map((e,i)=>`
    <a class="svc-card" href="portfolio.html?id=p${i+1}" style="cursor:pointer;">
      <div class="svc-thumb" style="font-size:44px;">${e}</div>
      <div class="svc-body"><div class="svc-title">포트폴리오 예시 ${i+1}</div></div>
    </a>`).join('');

  let lbImages = [];
  let lbIndex = 0;
  function renderLightbox(){
    document.getElementById('lb-img').src = lbImages[lbIndex];
    document.getElementById('lb-thumbs').innerHTML = lbImages.length > 1 ? lbImages.map((src,i)=>`<img src="${src}" class="${i===lbIndex?'active':''}" data-lb-i="${i}">`).join('') : '';
  }
  document.getElementById('lb-thumbs').addEventListener('click', (e)=>{
    const t = e.target.closest('[data-lb-i]');
    if(!t) return;
    lbIndex = +t.getAttribute('data-lb-i');
    renderLightbox();
  });

  document.getElementById('portfolio-grid').addEventListener('click', (e)=>{
    const card = e.target.closest('[data-pf-view]');
    if(!card) return;
    const item = flPortfolio.find(p=>p.id===card.getAttribute('data-pf-view'));
    if(!item) return;
    lbImages = item.images;
    lbIndex = 0;
    renderLightbox();
    openModal('pf-lightbox');
  });

  const tiers = [
    {name:'베이직', desc:'기본 시안 1종 + 수정 1회', mult:1},
    {name:'스탠다드', desc:'시안 2종 + 수정 3회 + 원본파일', mult:1.6},
    {name:'프리미엄', desc:'시안 3종 + 무제한 수정 + 원본파일 + 우선작업', mult:2.4},
  ];
  document.getElementById('price-options').innerHTML = tiers.map((t,i)=>`
    <div class="price-option ${i===0?'selected':''}" data-tier="${i}">
      <div class="name">${t.name}</div>
      <div class="desc">${t.desc}</div>
      <div class="amt">₩${Math.round(svc.price*t.mult).toLocaleString()}</div>
    </div>`).join('');
  document.querySelectorAll('.price-option').forEach(el=>{
    el.addEventListener('click', ()=>{
      document.querySelectorAll('.price-option').forEach(o=>o.classList.remove('selected'));
      el.classList.add('selected');
    });
  });

  const flPhoto = FreewayStore.getFlPhoto(fl.id);
  document.getElementById('mini-pro').innerHTML = `
    <div class="avatar lg">${flPhoto ? `<img src="${flPhoto}">` : fl.avatar}</div>
    <div>
      <div style="font-weight:800; font-size:14.5px; display:flex; align-items:center; gap:5px;">${fl.name} ${fl.verified?'<span class="verified">✔</span>':''}</div>
      <div style="font-size:12px; color:var(--gray-500);">${fl.role} · ${fl.career}</div>
      <div style="font-size:12px; color:var(--amber); font-weight:700; margin-top:2px;">★ ${fl.rating} (${fl.reviews})</div>
      <div style="font-size:11.5px; color:var(--gray-500); margin-top:2px;">응답률 ${fl.response}</div>
      <a href="freelancer.html?id=${fl.id}" style="font-size:12.5px; color:var(--primary); font-weight:700;">프로필 상세보기 →</a>
    </div>`;

  document.getElementById('review-list').innerHTML = FREEWAY_REVIEWS.map(r=>`
    <div class="review-item">
      <div class="stars">${'★'.repeat(r.rating)}</div>
      <p style="font-size:13.5px; color:var(--gray-700); margin:8px 0;">${r.text}</p>
      <div style="font-size:12px; color:var(--gray-500);">${r.name} · ${r.role}</div>
    </div>`).join('');

  initFavoriteButtons();
</script>
</body>
</html>
