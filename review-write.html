<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리뷰 작성 | 프리웨이</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .rv-wrap{max-width:560px; margin:0 auto;}
  .star-picker{display:flex; gap:6px; font-size:32px; color:var(--gray-300); cursor:pointer;}
  .star-picker span.filled{color:var(--amber);}
  .sub-crit{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--gray-100);}
  .sub-crit .star-picker{font-size:20px;}
  .photo-upload{display:flex; gap:10px; flex-wrap:wrap;}
  .photo-slot{width:72px; height:72px; border:1.5px dashed var(--gray-300); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--gray-500); cursor:pointer;}
</style>
</head>
<body>
<header class="site-header"></header>

<main class="page container rv-wrap">
  <div id="rv-form">
    <h1 class="section-title" style="text-align:center;">리뷰 작성</h1>
    <p class="section-sub" style="text-align:center; margin:0 auto 28px;">거래하신 서비스는 어떠셨나요?</p>

    <div class="card pad-24">
      <div style="display:flex; gap:12px; align-items:center; margin-bottom:20px;">
        <div class="avatar lg" id="rv-avatar"></div>
        <div><div style="font-weight:700;" id="rv-fl-name"></div><div class="text-muted" style="font-size:12.5px;" id="rv-svc-title"></div></div>
      </div>

      <div style="text-align:center; margin-bottom:20px;">
        <div class="text-muted" style="font-size:12.5px; margin-bottom:8px;">전체 만족도</div>
        <div class="star-picker" id="star-overall"></div>
      </div>

      <div class="sub-crit"><span style="font-size:13.5px;">전문성</span><div class="star-picker" data-crit="expertise">★★★★★</div></div>
      <div class="sub-crit"><span style="font-size:13.5px;">소통</span><div class="star-picker" data-crit="communication">★★★★★</div></div>
      <div class="sub-crit"><span style="font-size:13.5px;">일정준수</span><div class="star-picker" data-crit="schedule">★★★★★</div></div>

      <div class="field" style="margin-top:20px;">
        <label>상세 후기</label>
        <textarea id="rv-text" placeholder="서비스는 어떠셨나요? 다른 클라이언트들에게 도움이 될 후기를 남겨주세요."></textarea>
      </div>

      <div class="field">
        <label>사진 첨부 (선택)</label>
        <div class="photo-upload">
          <div class="photo-slot" onclick="FreewayStore.toast('사진이 첨부되었습니다')">📷</div>
        </div>
      </div>

      <label class="checkbox-row" style="margin-bottom:20px;"><input type="checkbox" id="rv-anon"> 익명으로 작성하기</label>
      <button class="btn btn-primary btn-block btn-lg" id="rv-submit">리뷰 등록하기</button>
    </div>
  </div>

  <div id="rv-done" class="hidden" style="text-align:center; padding:60px 0;">
    <div style="font-size:48px; margin-bottom:16px;">🙏</div>
    <h2 style="margin-bottom:10px;">소중한 리뷰 감사합니다!</h2>
    <p class="text-muted" style="margin-bottom:24px;">작성해주신 리뷰는 다른 이용자들에게 큰 도움이 됩니다.</p>
    <a href="mypage-cl-projects.html" class="btn btn-primary btn-lg">내 프로젝트로 돌아가기</a>
  </div>
</main>

<footer class="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  freewayMount();
  const fl = FREEWAY_FREELANCERS[0];
  const svc = FREEWAY_SERVICES.find(s=>s.freelancerId===fl.id);
  document.getElementById('rv-avatar').textContent = fl.avatar;
  document.getElementById('rv-fl-name').textContent = fl.name;
  document.getElementById('rv-svc-title').textContent = svc.title;

  function buildStars(container, count, size){
    container.innerHTML = Array.from({length:5}, (_,i)=>`<span data-v="${i+1}" class="${i<count?'filled':''}">★</span>`).join('');
  }
  buildStars(document.getElementById('star-overall'), 5);
  document.querySelectorAll('.sub-crit .star-picker').forEach(p=>buildStars(p,5));

  document.addEventListener('click', (e)=>{
    const span = e.target.closest('.star-picker span');
    if(!span) return;
    const picker = span.closest('.star-picker');
    const v = +span.getAttribute('data-v');
    buildStars(picker, v);
  });

  document.getElementById('rv-submit').addEventListener('click', ()=>{
    if(!document.getElementById('rv-text').value.trim()){
      FreewayStore.toast('후기 내용을 입력해주세요');
      return;
    }
    document.getElementById('rv-form').classList.add('hidden');
    document.getElementById('rv-done').classList.remove('hidden');
  });
</script>
</body>
</html>
