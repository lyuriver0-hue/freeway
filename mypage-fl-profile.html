<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업체 사진·포트폴리오 관리 | 프리웨이</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .biz-photo-wrap{display:flex; gap:22px; align-items:center; flex-wrap:wrap;}
  .biz-photo{width:120px; height:120px; border-radius:20px; object-fit:cover; background:var(--primary-light); flex-shrink:0;}
  .biz-photo-placeholder{width:120px; height:120px; border-radius:20px; background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:38px; flex-shrink:0;}
  .biz-photo-actions{display:flex; gap:8px;}
  .biz-photo-hint{font-size:12.5px; color:var(--gray-500); margin-top:8px;}

  .portfolio-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:18px;}
  @media (max-width:860px){ .portfolio-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .portfolio-grid{grid-template-columns:1fr;} }
  .pf-item{position:relative; border:1px solid var(--gray-200); border-radius:var(--radius); overflow:hidden; background:#fff; cursor:pointer;}
  .pf-item img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block;}
  .pf-item .pf-body{padding:12px 14px;}
  .pf-item .pf-title{font-weight:700; font-size:13.5px; margin-bottom:4px;}
  .pf-item .pf-desc{font-size:12px; color:var(--gray-500); line-height:1.5;}
  .pf-item .pf-del{position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:50%; background:rgba(17,24,39,0.55); color:#fff; border:none; cursor:pointer; font-size:14px; z-index:2;}
  .pf-item .pf-del:hover{background:#DC2626;}
  .pf-count-badge{position:absolute; bottom:8px; right:8px; background:rgba(17,24,39,0.7); color:#fff; font-size:11px; font-weight:700; padding:3px 9px; border-radius:100px;}

  .upload-drop{border:1.5px dashed var(--gray-300); border-radius:var(--radius-sm); padding:20px; text-align:center; cursor:pointer; font-size:13px; color:var(--gray-500);}
  .upload-drop:hover{border-color:var(--primary); color:var(--primary);}
  .pf-preview-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px;}
  .pf-preview-thumb{position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden;}
  .pf-preview-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .pf-preview-del{position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; background:rgba(17,24,39,0.6); color:#fff; border:none; cursor:pointer; font-size:11px; line-height:1;}
  .pf-img-count{font-size:11.5px; color:var(--gray-500); margin-top:6px; text-align:right;}

  .preview-frame{border:1px solid var(--gray-200); border-radius:var(--radius); background:var(--gray-50); padding:22px; margin-top:16px;}
  .preview-pro-header{display:flex; gap:16px; align-items:center; margin-bottom:20px;}
  .preview-pro-header .avatar img{width:100%; height:100%; object-fit:cover; border-radius:inherit;}
  .preview-name{font-weight:800; font-size:16.5px;}
  .preview-role{font-size:12.5px; color:var(--gray-500); margin-top:2px;}
  .preview-portfolio-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:860px){ .preview-portfolio-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .preview-portfolio-grid{grid-template-columns:1fr;} }

  .pf-lightbox{position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:3000; padding:24px;}
  .pf-lightbox.open{display:flex;}
  .pf-lightbox .lb-content{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .pf-lightbox img#lb-img{max-width:min(900px,90vw); max-height:75vh; border-radius:8px;}
  .pf-lightbox .lb-close{position:absolute; top:24px; right:32px; font-size:28px; cursor:pointer; color:#fff;}
  .lb-thumbs{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:min(900px,90vw);}
  .lb-thumbs img{width:56px; height:56px; object-fit:cover; border-radius:6px; cursor:pointer; border:2px solid transparent; opacity:.6;}
  .lb-thumbs img.active{border-color:#fff; opacity:1;}
</style>
</head>
<body>
<header class="site-header"></header>

<main class="page container">
  <div class="mypage-layout">
    <aside class="mypage-side" id="side"></aside>
    <div>
      <h1 class="section-title" style="font-size:22px; margin-bottom:20px;">업체 사진·포트폴리오 관리</h1>

      <div class="card pad-24" style="margin-bottom:24px;">
        <h3 style="font-size:15.5px; margin-bottom:16px;">업체 대표 사진</h3>
        <div class="biz-photo-wrap">
          <img class="biz-photo" id="biz-photo-img" style="display:none;">
          <div class="biz-photo-placeholder" id="biz-photo-placeholder"></div>
          <div>
            <div class="biz-photo-actions">
              <button class="btn btn-primary btn-sm" onclick="document.getElementById('biz-photo-input').click()">사진 변경</button>
              <button class="btn btn-outline-danger btn-sm" id="biz-photo-remove">삭제</button>
            </div>
            <p class="biz-photo-hint">전문가 프로필 상단과 검색 결과에 노출되는 대표 사진입니다.</p>
            <input type="file" accept="image/*" id="biz-photo-input" style="display:none;">
          </div>
        </div>
      </div>

      <div class="card pad-24" style="margin-bottom:24px;">
        <div class="section-head" style="margin-bottom:0;">
          <h3 style="font-size:15.5px;">포트폴리오</h3>
          <button class="btn btn-primary btn-sm" onclick="openModal('pf-add-modal')">+ 포트폴리오 추가</button>
        </div>
        <div class="portfolio-grid" id="pf-grid"></div>
      </div>

      <div class="card pad-24">
        <h3 style="font-size:15.5px; margin-bottom:4px;">노출 미리보기</h3>
        <p class="text-muted" style="font-size:12.5px;">고객이 전문가 프로필 페이지에서 실제로 보게 될 화면입니다.</p>
        <div class="preview-frame">
          <div class="preview-pro-header">
            <div class="avatar lg" id="preview-avatar"></div>
            <div>
              <div class="preview-name" id="preview-name"></div>
              <div class="preview-role" id="preview-role"></div>
            </div>
          </div>
          <div class="preview-portfolio-grid" id="preview-portfolio"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="modal-overlay" id="pf-add-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('pf-add-modal')">✕</button>
    <h3>포트폴리오 추가</h3>
    <div class="field">
      <label>이미지 (최대 6장)</label>
      <div class="upload-drop" onclick="document.getElementById('pf-img-input').click()">클릭해서 이미지를 선택하세요 (여러 장 선택 가능)</div>
      <input type="file" accept="image/*" id="pf-img-input" multiple style="display:none;">
      <div class="pf-preview-grid" id="pf-img-preview-grid"></div>
      <div class="pf-img-count" id="pf-img-count">0 / 6장</div>
    </div>
    <div class="field"><label>제목</label><input type="text" id="pf-title" placeholder="예: 스타트업 브랜드 아이덴티티 리뉴얼"></div>
    <div class="field"><label>설명</label><textarea id="pf-desc" placeholder="작업 내용을 간단히 소개해주세요"></textarea></div>
    <button class="btn btn-primary btn-block" id="pf-submit">등록하기</button>
  </div>
</div>

<div class="pf-lightbox" id="pf-lightbox">
  <span class="lb-close" onclick="closeModal('pf-lightbox')">✕</span>
  <div class="lb-content">
    <img id="lb-img">
    <div class="lb-thumbs" id="lb-thumbs"></div>
  </div>
</div>

<footer class="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  freewayMount();
  document.getElementById('side').innerHTML = freewayMypageSidebar('freelancer', 'mypage-fl-profile.html');

  const myFlId = 'f1';
  const myFl = FREEWAY_FREELANCERS.find(f=>f.id===myFlId);

  function readImageAsDataURL(file, maxSize){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = reject;
        img.onload = ()=>{
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* ---------------- 라이트박스 (여러 장 보기) ---------------- */
  let lbImages = [];
  let lbIndex = 0;
  function openLightbox(images){
    lbImages = images;
    lbIndex = 0;
    renderLightbox();
    openModal('pf-lightbox');
  }
  function renderLightbox(){
    document.getElementById('lb-img').src = lbImages[lbIndex];
    document.getElementById('lb-thumbs').innerHTML = lbImages.length > 1 ? lbImages.map((src,i)=>`<img src="${src}" class="${i===lbIndex?'active':''}" data-lb-i="${i}">`).join('') : '';
  }
  document.getElementById('lb-thumbs').addEventListener('click', (e)=>{
    const t = e.target.closest('[data-lb-i]');
    if(!t) return;
    lbIndex = +t.getAttribute('data-lb-i');
    renderLightbox();
  });

  /* ---------------- 노출 미리보기 ---------------- */
  function renderPreview(){
    const photo = FreewayStore.getFlPhoto(myFlId);
    document.getElementById('preview-avatar').innerHTML = photo ? `<img src="${photo}">` : myFl.avatar;
    document.getElementById('preview-name').innerHTML = `${myFl.name} ${myFl.verified?'<span class="verified">✔</span>':''}`;
    document.getElementById('preview-role').textContent = `${myFl.role} · ${myFl.career}`;

    const list = FreewayStore.getFlPortfolio(myFlId);
    document.getElementById('preview-portfolio').innerHTML = list.map(p=>`
      <div class="svc-card" data-pf-view="${p.id}">
        <div class="svc-thumb" style="padding:0;">
          <img src="${p.images[0]}" style="width:100%; height:100%; object-fit:cover;">
          ${p.images.length>1?`<span class="pf-count-badge">🖼 ${p.images.length}</span>`:''}
        </div>
        <div class="svc-body"><div class="svc-title">${p.title}</div></div>
      </div>`).join('') || '<p class="text-muted" style="grid-column:1/-1;">포트폴리오를 추가하면 이곳에 미리보기가 표시됩니다.</p>';
  }

  document.getElementById('preview-portfolio').addEventListener('click', (e)=>{
    const card = e.target.closest('[data-pf-view]');
    if(!card) return;
    const item = FreewayStore.getFlPortfolio(myFlId).find(p=>p.id===card.getAttribute('data-pf-view'));
    if(item) openLightbox(item.images);
  });

  /* ---------------- 업체 대표 사진 ---------------- */
  function renderPhoto(){
    const photo = FreewayStore.getFlPhoto(myFlId);
    document.getElementById('biz-photo-img').style.display = photo ? 'block' : 'none';
    document.getElementById('biz-photo-img').src = photo || '';
    document.getElementById('biz-photo-placeholder').style.display = photo ? 'none' : 'flex';
    document.getElementById('biz-photo-placeholder').textContent = myFl.avatar;
    renderPreview();
  }
  renderPhoto();

  document.getElementById('biz-photo-input').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const dataUrl = await readImageAsDataURL(file, 480);
    FreewayStore.setFlPhoto(myFlId, dataUrl);
    renderPhoto();
    FreewayStore.toast('업체 사진이 변경되었습니다');
    e.target.value = '';
  });

  document.getElementById('biz-photo-remove').addEventListener('click', ()=>{
    FreewayStore.removeFlPhoto(myFlId);
    renderPhoto();
    FreewayStore.toast('업체 사진이 삭제되었습니다');
  });

  /* ---------------- 포트폴리오 ---------------- */
  function renderPortfolio(){
    const list = FreewayStore.getFlPortfolio(myFlId);
    document.getElementById('pf-grid').innerHTML = list.map(p=>`
      <div class="pf-item" data-pf-view="${p.id}">
        <button class="pf-del" data-pf-del="${p.id}">✕</button>
        <div style="position:relative;">
          <img src="${p.images[0]}">
          ${p.images.length>1?`<span class="pf-count-badge">🖼 ${p.images.length}</span>`:''}
        </div>
        <div class="pf-body">
          <div class="pf-title">${p.title}</div>
          <div class="pf-desc">${p.desc || ''}</div>
        </div>
      </div>`).join('') || '<p class="text-muted" style="grid-column:1/-1;">등록된 포트폴리오가 없습니다. 대표 작업물을 추가해보세요.</p>';
    renderPreview();
  }
  renderPortfolio();

  document.getElementById('pf-grid').addEventListener('click', (e)=>{
    const del = e.target.closest('[data-pf-del]');
    if(del){
      FreewayStore.removeFlPortfolioItem(myFlId, del.getAttribute('data-pf-del'));
      renderPortfolio();
      FreewayStore.toast('포트폴리오가 삭제되었습니다');
      return;
    }
    const card = e.target.closest('[data-pf-view]');
    if(card){
      const item = FreewayStore.getFlPortfolio(myFlId).find(p=>p.id===card.getAttribute('data-pf-view'));
      if(item) openLightbox(item.images);
    }
  });

  /* ---------------- 포트폴리오 추가 모달: 여러 장 업로드 ---------------- */
  const PF_IMG_MAX = 6;
  let pendingPfImages = [];

  function renderPfImagePreview(){
    document.getElementById('pf-img-preview-grid').innerHTML = pendingPfImages.map((src,i)=>`
      <div class="pf-preview-thumb">
        <img src="${src}">
        <button type="button" class="pf-preview-del" data-preview-del="${i}">✕</button>
      </div>`).join('');
    document.getElementById('pf-img-count').textContent = `${pendingPfImages.length} / ${PF_IMG_MAX}장`;
  }

  document.getElementById('pf-img-input').addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files);
    for(const file of files){
      if(pendingPfImages.length >= PF_IMG_MAX){ FreewayStore.toast(`이미지는 최대 ${PF_IMG_MAX}장까지 등록할 수 있습니다`); break; }
      const dataUrl = await readImageAsDataURL(file, 800);
      pendingPfImages.push(dataUrl);
      renderPfImagePreview();
    }
    e.target.value = '';
  });

  document.getElementById('pf-img-preview-grid').addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-preview-del]');
    if(!btn) return;
    pendingPfImages.splice(+btn.getAttribute('data-preview-del'), 1);
    renderPfImagePreview();
  });

  document.getElementById('pf-submit').addEventListener('click', ()=>{
    const title = document.getElementById('pf-title').value.trim();
    const desc = document.getElementById('pf-desc').value.trim();
    if(pendingPfImages.length === 0){ FreewayStore.toast('이미지를 1장 이상 선택해주세요'); return; }
    if(!title){ FreewayStore.toast('제목을 입력해주세요'); return; }
    FreewayStore.addFlPortfolioItem(myFlId, {id:'pf'+Date.now(), title, desc, images: pendingPfImages.slice()});
    renderPortfolio();
    closeModal('pf-add-modal');
    FreewayStore.toast('포트폴리오가 등록되었습니다');
    document.getElementById('pf-title').value = '';
    document.getElementById('pf-desc').value = '';
    pendingPfImages = [];
    renderPfImagePreview();
  });
</script>
</body>
</html>
