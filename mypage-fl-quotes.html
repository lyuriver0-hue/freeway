<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제안 견적서 관리 | 프리웨이</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="site-header"></header>

<main class="page container">
  <div class="mypage-layout">
    <aside class="mypage-side" id="side"></aside>
    <div>
      <h1 class="section-title" style="font-size:22px; margin-bottom:20px;">제안 견적서 관리</h1>
      <div class="tabs" data-tabs>
        <button class="tab-btn active" data-tab-target="t-all" data-filter="all">전체</button>
        <button class="tab-btn" data-tab-target="t-all" data-filter="pending">대기중</button>
        <button class="tab-btn" data-tab-target="t-all" data-filter="accepted">수락됨</button>
        <button class="tab-btn" data-tab-target="t-all" data-filter="rejected">거절됨</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>프로젝트명</th><th>클라이언트</th><th>제안금액</th><th>제안일</th><th>상태</th><th></th></tr></thead>
          <tbody id="q-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div class="modal-overlay" id="q-detail-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('q-detail-modal')">✕</button>
    <h3>제안 상세</h3>
    <div id="q-detail-body" style="font-size:13.5px; line-height:2; color:var(--gray-700);"></div>
  </div>
</div>

<footer class="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  freewayMount();
  document.getElementById('side').innerHTML = freewayMypageSidebar('freelancer', 'mypage-fl-quotes.html');

  const myFlId = 'f1';
  const myQuotes = FREEWAY_QUOTES.filter(q=>q.freelancerId===myFlId).concat([
    {id:'q9', projectId:'pj3', freelancerId:'f1', amount:150000, days:5, message:'추가 배너 디자인 제안드립니다.', status:'rejected'}
  ]);
  const statusLabel = {pending:'대기중', accepted:'수락됨', rejected:'거절됨'};
  const statusClass = {pending:'pending', accepted:'done', rejected:'rejected'};

  let currentFilter = 'all';
  function render(){
    const list = myQuotes.filter(q=>currentFilter==='all' || q.status===currentFilter);
    document.getElementById('q-body').innerHTML = list.map(q=>{
      const pj = FREEWAY_PROJECTS.find(p=>p.id===q.projectId);
      return `<tr>
        <td>${pj ? pj.title : '(삭제된 프로젝트)'}</td>
        <td>${pj ? pj.client : '-'}</td>
        <td>₩${q.amount.toLocaleString()}</td>
        <td>2026-07-0${q.id.slice(-1)}</td>
        <td><span class="status ${statusClass[q.status]}">${statusLabel[q.status]}</span></td>
        <td><button class="btn btn-ghost btn-sm" data-detail="${q.id}">상세보기</button></td>
      </tr>`;
    }).join('') || `<tr><td colspan="6" style="text-align:center; color:var(--gray-500); padding:32px;">해당 상태의 제안이 없습니다.</td></tr>`;
  }
  render();

  document.addEventListener('click', (e)=>{
    const filterBtn = e.target.closest('.tab-btn[data-filter]');
    if(filterBtn){ currentFilter = filterBtn.getAttribute('data-filter'); render(); }
  });

  document.addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-detail]');
    if(!btn) return;
    const q = myQuotes.find(x=>x.id===btn.getAttribute('data-detail'));
    const pj = FREEWAY_PROJECTS.find(p=>p.id===q.projectId);
    document.getElementById('q-detail-body').innerHTML = `
      <div><b>프로젝트</b> · ${pj?pj.title:'-'}</div>
      <div><b>제안금액</b> · ₩${q.amount.toLocaleString()}</div>
      <div><b>예상기간</b> · ${q.days}일</div>
      <div><b>상태</b> · ${statusLabel[q.status]}</div>
      <div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--gray-100);"><b>제안 메시지</b><br>${q.message}</div>`;
    openModal('q-detail-modal');
  });
</script>
</body>
</html>
