<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전문가 프로필 | 프리웨이</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .pro-header{display:flex; gap:22px; align-items:center; padding:28px; background:#fff; border:1px solid var(--gray-200); border-radius:var(--radius); margin-bottom:24px; flex-wrap:wrap;}
  .pro-header .info{flex:1; min-width:220px;}
  .pro-header h1{font-size:22px; display:flex; align-items:center; gap:8px;}
  .pro-meta{display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--gray-500); margin:10px 0;}
  .career-item{display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--gray-100);}
  .career-item .dot-line{width:10px; height:10px; border-radius:50%; background:var(--primary); margin-top:5px; flex-shrink:0;}
  .skill-tag{display:inline-block; background:var(--gray-100); padding:6px 12px; border-radius:100px; font-size:12.5px; font-weight:600; color:var(--gray-700); margin:0 6px 6px 0;}
  .avatar.xl img{width:100%; height:100%; object-fit:cover; border-radius:inherit;}
  .pf-lightbox{position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:3000; padding:24px;}
  .pf-lightbox.open{display:flex;}
  .pf-lightbox img{max-width:min(900px,90vw); max-height:85vh; border-radius:8px;}
  .pf-lightbox .lb-close{position:absolute; top:24px; right:32px; font-size:28px; cursor:pointer; color:#fff;}
</style>
</head>
<body>
<header class="site-header"></header>

<main class="page container">
  <div class="breadcrumb"><a href="index.html">홈</a> / <span>전문가 프로필</span></div>

  <div class="pro-header">
    <div class="avatar xl" id="fl-avatar"></div>
    <div class="info">
      <h1 id="fl-name"></h1>
      <div class="pro-meta">
        <span id="fl-role"></span>
        <span>★ <b id="fl-rating"></b> (<span id="fl-reviews"></span>)</span>
        <span>⏱ 응답률 <b id="fl-response"></b></span>
      </div>
      <div id="fl-badges"></div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn-icon" id="fl-heart">♥</button>
      <a href="chat.html" class="btn btn-primary">💬 1:1 채팅 문의</a>
    </div>
  </div>

  <div class="tabs" data-tabs>
    <button class="tab-btn active" data-tab-target="tab-intro">소개</button>
    <button class="tab-btn" data-tab-target="tab-services">제공 서비스</button>
    <button class="tab-btn" data-tab-target="tab-portfolio">포트폴리오</button>
    <button class="tab-btn" data-tab-target="tab-career">자격증&amp;경력</button>
    <button class="tab-btn" data-tab-target="tab-reviews">리뷰</button>
  </div>

  <div class="tab-panel active" id="tab-intro">
    <p style="line-height:1.9; font-size:14.5px; color:var(--gray-700); max-width:720px;" id="fl-bio"></p>
    <div style="margin-top:18px;" id="fl-tags"></div>
  </div>

  <div class="tab-panel" id="tab-services">
    <div class="svc-grid" id="fl-services"></div>
  </div>

  <div class="tab-panel" id="tab-portfolio">
    <div class="grid-3" id="fl-portfolio"></div>
  </div>

  <div class="tab-panel" id="tab-career">
    <div class="card pad-24">
      <h3 style="font-size:15.5px; margin-bottom:14px;">경력 사항</h3>
      <div id="fl-career-list"></div>
      <h3 style="font-size:15.5px; margin:22px 0 14px;">보유 자격증 / 인증</h3>
      <div id="fl-certs"></div>
    </div>
  </div>

  <div class="tab-panel" id="tab-reviews">
    <div class="card pad-24">
      <div style="display:flex; align-items:center; gap:20px; margin-bottom:20px;">
        <div style="font-size:38px; font-weight:900;" id="fl-rating-big"></div>
        <div>
          <div class="stars" id="fl-stars-big" style="font-size:18px;"></div>
          <div style="font-size:12.5px; color:var(--gray-500);">문의 <b id="fl-inquiries">245</b>건 · 리뷰 <span id="fl-reviews2"></span>건</div>
        </div>
      </div>
      <div id="fl-review-list"></div>
    </div>
  </div>
</main>

<div class="pf-lightbox" id="pf-lightbox">
  <span class="lb-close" onclick="closeModal('pf-lightbox')">✕</span>
  <img id="lb-img">
</div>

<footer class="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  freewayMount();
  const params = new URLSearchParams(location.search);
  const fl = FREEWAY_FREELANCERS.find(f=>f.id===params.get('id')) || FREEWAY_FREELANCERS[0];

  const flPhoto = FreewayStore.getFlPhoto(fl.id);
  document.getElementById('fl-avatar').innerHTML = flPhoto ? `<img src="${flPhoto}">` : fl.avatar;
  document.getElementById('fl-name').innerHTML = `${fl.name} ${fl.verified?'<span class="verified">✔</span>':''}`;
  document.getElementById('fl-role').textContent = `${fl.role} · ${fl.career}`;
  document.getElementById('fl-rating').textContent = fl.rating;
  document.getElementById('fl-reviews').textContent = fl.reviews + '건';
  document.getElementById('fl-response').textContent = fl.response;
  document.getElementById('fl-heart').setAttribute('data-fav-id', fl.id);
  document.getElementById('fl-bio').textContent = fl.bio;
  document.getElementById('fl-tags').innerHTML = fl.tags.map(t=>`<span class="skill-tag">${t}</span>`).join('');

  document.getElementById('fl-badges').innerHTML = `
    ${fl.verified? '<span class="badge badge-green">🏢 사업자등록증 인증</span>' : '<span class="badge badge-gray">인증 대기중</span>'}
    <span class="badge badge-blue">경력 ${fl.career}</span>`;

  const flServices = FREEWAY_SERVICES.filter(s=>s.freelancerId===fl.id);
  document.getElementById('fl-services').innerHTML = flServices.map(s=>`
    <a class="svc-card" href="service-detail.html?id=${s.id}">
      <div class="svc-thumb">${s.thumb}<button class="svc-heart" data-fav-id="${s.id}">♥</button></div>
      <div class="svc-body">
        <div class="svc-cat">${s.catName}</div>
        <div class="svc-title">${s.title}</div>
        <div class="svc-foot">
          <span class="svc-rating">★ ${s.rating} <span>(${s.reviews})</span></span>
          <span class="svc-price">₩${s.price.toLocaleString()}<small> ~</small></span>
        </div>
      </div>
    </a>`).join('') || '<p class="text-muted">등록된 서비스가 없습니다.</p>';

  const flPortfolio = FreewayStore.getFlPortfolio(fl.id);
  document.getElementById('fl-portfolio').innerHTML = flPortfolio.length ? flPortfolio.map(p=>`
    <div class="svc-card" data-pf-view="${p.id}">
      <div class="svc-thumb" style="padding:0;"><img src="${p.image}" style="width:100%; height:100%; object-fit:cover;"></div>
      <div class="svc-body"><div class="svc-title">${p.title}</div></div>
    </div>`).join('') : ['🖼️','🖌️','📐','🧩','📱','🎯'].map((e,i)=>`
    <a class="svc-card" href="portfolio.html?id=p${i+1}">
      <div class="svc-thumb" style="font-size:40px;">${e}</div>
      <div class="svc-body"><div class="svc-title">포트폴리오 프로젝트 ${i+1}</div></div>
    </a>`).join('');

  document.getElementById('fl-portfolio').addEventListener('click', (e)=>{
    const card = e.target.closest('[data-pf-view]');
    if(!card) return;
    const item = flPortfolio.find(p=>p.id===card.getAttribute('data-pf-view'));
    if(!item) return;
    document.getElementById('lb-img').src = item.image;
    openModal('pf-lightbox');
  });

  document.getElementById('fl-career-list').innerHTML = `
    <div class="career-item"><div class="dot-line"></div><div><b>${fl.role}</b> · 프리랜서 활동 (현재)<div class="text-muted" style="font-size:12.5px;">2019 ~ 현재</div></div></div>
    <div class="career-item"><div class="dot-line"></div><div><b>관련 분야 실무 경력</b><div class="text-muted" style="font-size:12.5px;">기업 재직 경력 보유</div></div></div>`;
  document.getElementById('fl-certs').innerHTML = `
    <span class="badge badge-blue" style="margin-right:8px;">국가공인 자격증 보유</span>
    ${fl.verified?'<span class="badge badge-green">사업자등록증 인증완료</span>':''}`;

  document.getElementById('fl-rating-big').textContent = fl.rating;
  document.getElementById('fl-stars-big').textContent = '★★★★★';
  document.getElementById('fl-reviews2').textContent = fl.reviews;
  document.getElementById('fl-review-list').innerHTML = FREEWAY_REVIEWS.map(r=>`
    <div class="review-item">
      <div class="stars">${'★'.repeat(r.rating)}</div>
      <p style="font-size:13.5px; color:var(--gray-700); margin:8px 0;">${r.text}</p>
      <div style="font-size:12px; color:var(--gray-500);">${r.name}</div>
    </div>`).join('');

  initFavoriteButtons();
</script>
</body>
</html>
