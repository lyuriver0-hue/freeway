<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1:1 채팅 | 프리웨이</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .quote-msg-actions{display:flex; gap:8px; margin-top:10px;}
</style>
</head>
<body>
<header class="site-header"></header>

<main class="page container">
  <div class="chat-layout">
    <div class="chat-list" id="chat-list"></div>
    <div class="chat-main">
      <div class="chat-head" id="chat-head"></div>
      <div class="chat-body" id="chat-body"></div>
      <div class="chat-input">
        <button class="btn-icon" title="견적서 보내기" onclick="sendQuoteCard()">📄</button>
        <input type="text" id="chat-text" placeholder="메시지를 입력하세요">
        <button class="btn btn-primary btn-sm" id="chat-send">전송</button>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer" style="margin-top:24px;"></footer>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  freewayMount();
  const params = new URLSearchParams(location.search);
  const targets = FREEWAY_FREELANCERS.slice(0,4);
  let activeId = params.get('fl') || targets[0].id;

  const chatHistory = {};
  targets.forEach(f=>{
    chatHistory[f.id] = [
      {from:'them', text:`안녕하세요! ${f.name}입니다. 문의 주셔서 감사합니다.`},
      {from:'me', text:'안녕하세요, 프로젝트 관련해서 문의드리고 싶어요.'},
      {from:'them', text:'네, 편하게 말씀해주세요 :)'},
    ];
  });

  function renderList(){
    document.getElementById('chat-list').innerHTML = targets.map(f=>{
      const last = chatHistory[f.id][chatHistory[f.id].length-1];
      return `<div class="chat-list-item ${f.id===activeId?'active':''}" data-fl="${f.id}">
        <div class="avatar">${f.avatar}</div>
        <div style="flex:1; min-width:0;">
          <div class="name">${f.name}</div>
          <div class="preview">${last.text}</div>
        </div>
        <div class="time">방금</div>
      </div>`;
    }).join('');
  }

  function renderChat(){
    const f = targets.find(x=>x.id===activeId);
    document.getElementById('chat-head').innerHTML = `
      <div class="avatar">${f.avatar}</div>
      <div><div style="font-weight:700; font-size:14.5px;">${f.name}</div><div class="text-muted" style="font-size:12px;">응답률 ${f.response}</div></div>`;
    document.getElementById('chat-body').innerHTML = chatHistory[activeId].map(m=>{
      if(m.type==='quote'){
        return `<div class="bubble quote">
          <div style="font-weight:700; font-size:13.5px; margin-bottom:4px;">📄 견적서</div>
          <div style="font-size:13px; color:var(--gray-700);">${m.text}</div>
          <div style="font-weight:800; font-size:16px; margin-top:6px;">₩${m.amount.toLocaleString()}</div>
          <div class="quote-msg-actions">
            <button class="btn btn-primary btn-sm" data-quote-accept="1">수락</button>
            <button class="btn btn-ghost btn-sm">거절</button>
          </div>
        </div>`;
      }
      return `<div class="bubble ${m.from==='me'?'me':'them'}">${m.text}</div>`;
    }).join('');
    document.getElementById('chat-body').scrollTop = 999999;
  }

  renderList();
  renderChat();

  document.addEventListener('click', (e)=>{
    const item = e.target.closest('.chat-list-item');
    if(item){ activeId = item.getAttribute('data-fl'); renderList(); renderChat(); return; }
    const acceptBtn = e.target.closest('[data-quote-accept]');
    if(acceptBtn){
      FreewayStore.toast('견적을 수락했습니다. 안전결제를 진행해주세요.');
      acceptBtn.closest('.quote-msg-actions').innerHTML = '<span class="status done">수락 완료</span>';
    }
  });

  function sendMessage(){
    const input = document.getElementById('chat-text');
    const text = input.value.trim();
    if(!text) return;
    chatHistory[activeId].push({from:'me', text});
    input.value = '';
    renderChat();
    renderList();
    setTimeout(()=>{
      chatHistory[activeId].push({from:'them', text:'네, 확인했습니다! 곧 답변드릴게요.'});
      renderChat(); renderList();
    }, 900);
  }
  function sendQuoteCard(){
    chatHistory[activeId].push({type:'quote', text:'요청하신 작업에 대한 견적서를 보내드립니다.', amount: FREEWAY_SERVICES.find(s=>s.freelancerId===activeId)?.price || 300000});
    renderChat();
  }
  document.getElementById('chat-send').addEventListener('click', sendMessage);
  document.getElementById('chat-text').addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendMessage(); });
</script>
</body>
</html>
