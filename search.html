<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>검색결과 | 프리웨이</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .search-head{margin-bottom:22px;}
  .search-head input{width:100%; max-width:520px; padding:13px 16px; border:1.5px solid var(--gray-300); border-radius:10px; font-size:15px; outline:none;}
  .search-head input:focus{border-color:var(--primary);}
  mark{background:#FEF9C3; padding:0 2px; border-radius:3px;}
  .pro-sort-bar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .pro-sort-bar .hint{font-size:12px; color:var(--gray-500);}
  .pro-card{position:relative;}
  .pro-ad-badge{position:absolute; top:12px; right:12px; display:flex; align-items:center; gap:4px; background:linear-gradient(135deg,#F59E0B,#EA580C); color:#fff; font-size:11px; font-weight:800; padding:4px 10px; border-radius:100px;}
  .pro-stats2{display:flex; flex-wrap:wrap; gap:10px; font-size:11.5px; color:var(--gray-500); margin-top:8px; padding-top:8px; border-top:1px solid var(--gray-100);}
  .pro-stats2 b{color:var(--gray-700);}
</style>
</head>
<body>
<header class="site-header"></header>

<main class="page container">
  <div class="search-head">
    <form onsubmit="event.preventDefault(); location.href='search.html?q='+encodeURIComponent(this.q.value);">
      <input name="q" id="search-input" type="text" placeholder="검색어를 입력하세요">
    </form>
    <p style="margin-top:12px; font-size:14px; color:var(--gray-500);"><b id="q-text"></b> 검색결과 <b id="q-count">0</b>건</p>
  </div>

  <div class="tabs" data-tabs>
    <button class="tab-btn active" data-tab-target="tab-all">전체</button>
    <button class="tab-btn" data-tab-target="tab-svc">서비스</button>
    <button class="tab-btn" data-tab-target="tab-pro">전문가</button>
    <button class="tab-btn" data-tab-target="tab-prj">프로젝트</button>
  </div>

  <div class="tab-panel active" id="tab-all">
    <h3 style="font-size:15px; margin-bottom:14px;">서비스</h3>
    <div class="svc-grid" id="all-svc"></div>
    <h3 style="font-size:15px; margin:28px 0 14px;">전문가</h3>
    <div class="pro-grid-search grid-3" id="all-pro"></div>
  </div>
  <div class="tab-panel" id="tab-svc">
    <div class="svc-grid" id="svc-only"></div>
  </div>
  <div class="tab-panel" id="tab-pro">
    <div class="pro-sort-bar">
      <select class="chip-select" id="pro-sort" style="padding:9px 14px; border:1.5px solid var(--gray-300); border-radius:9px; font-size:13px; font-weight:600; background:#fff;"></select>
      <span class="hint">상위노출 광고 적용 전문가가 우선 노출되며, 그 다음 선택한 기준으로 정렬됩니다.</span>
    </div>
    <div class="grid-3" id="pro-only"></div>
  </div>
  <div class="tab-panel" id="tab-prj">
    <div id="prj-only"></div>
  </div>

  <div id="no-result" class="empty-state hidden">
    <div class="emoji">🔍</div>
    <p>검색 결과가 없습니다.</p>
    <p class="text-muted" style="margin-top:6px;">인기 검색어: 로고디자인, 웹개발, SNS운영, 번역</p>
  </div>
</main>

<footer class="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  freewayMount('search');
  const params = new URLSearchParams(location.search);
  const q = (params.get('q') || '').trim();
  document.getElementById('search-input').value = q;
  document.getElementById('q-text').textContent = q ? `"${q}"` : '전체';

  function hi(text){
    if(!q) return text;
    try{
      const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
      return text.replace(re, '<mark>$1</mark>');
    }catch(e){ return text; }
  }

  const svcMatches = FREEWAY_SERVICES.filter(s=> !q || s.title.includes(q) || s.catName.includes(q));
  const proMatchesBase = FREEWAY_FREELANCERS.filter(f=> !q || f.name.includes(q) || f.role.includes(q) || f.tags.some(t=>t.includes(q)));
  const prjMatches = FREEWAY_PROJECTS.filter(p=> !q || p.title.includes(q) || p.catName.includes(q));

  function svcCard(s){
    const fl = FREEWAY_FREELANCERS.find(f=>f.id===s.freelancerId);
    return `<a class="svc-card" href="service-detail.html?id=${s.id}">
      <div class="svc-thumb">${s.thumb}<button class="svc-heart" data-fav-id="${s.id}">♥</button></div>
      <div class="svc-body">
        <div class="svc-cat">${s.catName}</div>
        <div class="svc-title">${hi(s.title)}</div>
        <div class="svc-pro"><span class="avatar" style="width:20px;height:20px;font-size:10px;border-radius:6px;">${fl.avatar}</span> ${fl.name}</div>
        <div class="svc-foot"><span class="svc-rating">★ ${s.rating} <span>(${s.reviews})</span></span><span class="svc-price">₩${s.price.toLocaleString()}<small> ~</small></span></div>
      </div></a>`;
  }
  function proCard(f){
    const boosted = FreewayStore.isBoosted(f.id);
    return `<a class="pro-card" style="display:block;" href="freelancer.html?id=${f.id}">
      ${boosted?'<span class="pro-ad-badge">🚀 광고</span>':''}
      <div class="pro-top"><div class="avatar lg">${f.avatar}</div>
        <div><div class="pro-name">${hi(f.name)} ${f.verified?'<span class="verified">✔</span>':''}</div>
        <div class="pro-role">${hi(f.role)} · ${f.career}</div>
        <div class="pro-rating">★★★★★ ${f.rating} (${f.reviews})</div></div>
      </div>
      <div class="pro-tags">${f.tags.map(t=>`<span>${t}</span>`).join('')}</div>
      <div class="pro-stats2">
        <span>거래 <b>${f.dealCount.toLocaleString()}</b>건</span>
        <span>응답률 <b>${f.responseRate}%</b></span>
        <span>재구매율 <b>${f.repurchaseRate}%</b></span>
      </div>
    </a>`;
  }
  function prjCard(p){
    return `<div class="card pad-20" style="margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div><div style="font-weight:700; font-size:14.5px;">${hi(p.title)}</div><div class="text-muted" style="font-size:12.5px;">${p.catName} · 예산 ₩${p.budget.toLocaleString()}</div></div>
      <span class="status ${p.status==='done'?'done':'progress'}">${p.status==='done'?'완료':'진행중'}</span>
    </div>`;
  }

  document.getElementById('all-svc').innerHTML = svcMatches.slice(0,4).map(svcCard).join('') || '<p class="text-muted">일치하는 서비스가 없습니다.</p>';
  document.getElementById('all-pro').innerHTML = sortFreelancers(proMatchesBase, 'recommend').slice(0,3).map(proCard).join('') || '<p class="text-muted">일치하는 전문가가 없습니다.</p>';
  document.getElementById('svc-only').innerHTML = svcMatches.map(svcCard).join('');
  document.getElementById('prj-only').innerHTML = prjMatches.map(prjCard).join('') || '<p class="text-muted">일치하는 프로젝트가 없습니다.</p>';

  const total = svcMatches.length + proMatchesBase.length + prjMatches.length;
  document.getElementById('q-count').textContent = total;
  document.getElementById('no-result').classList.toggle('hidden', total>0);

  /* ---------------- 전문가 정렬 필터 ---------------- */
  document.getElementById('pro-sort').innerHTML = FREEWAY_SORT_OPTIONS.map(o=>`<option value="${o.id}">${o.label}</option>`).join('');

  function renderProOnly(){
    const mode = document.getElementById('pro-sort').value;
    const sorted = sortFreelancers(proMatchesBase, mode);
    document.getElementById('pro-only').innerHTML = sorted.map(proCard).join('') || '<p class="text-muted">일치하는 전문가가 없습니다.</p>';
  }
  renderProOnly();
  document.getElementById('pro-sort').addEventListener('change', renderProOnly);

  initFavoriteButtons();
</script>
</body>
</html>
