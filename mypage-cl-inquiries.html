<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문의 내역 | 프리웨이</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .inq-item{display:flex; gap:14px; align-items:center; padding:16px; border-bottom:1px solid var(--gray-100); cursor:pointer;}
  .inq-item:hover{background:var(--gray-50);}
  .inq-item .preview{font-size:13px; color:var(--gray-500); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:360px;}
  .unread-dot{width:8px; height:8px; border-radius:50%; background:var(--red); flex-shrink:0;}
</style>
</head>
<body>
<header class="site-header"></header>

<main class="page container">
  <div class="mypage-layout">
    <aside class="mypage-side" id="side"></aside>
    <div>
      <h1 class="section-title" style="font-size:22px; margin-bottom:20px;">문의 내역</h1>
      <div class="card" id="inq-list"></div>
    </div>
  </div>
</main>

<footer class="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  freewayMount();
  document.getElementById('side').innerHTML = freewayMypageSidebar('client', 'mypage-cl-inquiries.html');

  const inquiries = FREEWAY_FREELANCERS.slice(0,4).map((f,i)=>({
    fl: f, preview: ['네, 견적서 확인했습니다. 진행하겠습니다!','작업 일정 관련하여 문의드립니다.','시안 파일 잘 받았습니다 :)','안녕하세요, 서비스 문의드려요.'][i],
    time: `${i+1}시간 전`, unread: i<2
  }));

  document.getElementById('inq-list').innerHTML = inquiries.map(iq=>`
    <a class="inq-item" href="chat.html?fl=${iq.fl.id}">
      <div class="avatar">${iq.fl.avatar}</div>
      <div style="flex:1; min-width:0;">
        <div style="font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px;">${iq.fl.name} ${iq.unread?'<span class=\"unread-dot\"></span>':''}</div>
        <div class="preview">${iq.preview}</div>
      </div>
      <div class="text-muted" style="font-size:11.5px; flex-shrink:0;">${iq.time}</div>
    </a>`).join('');
</script>
</body>
</html>
